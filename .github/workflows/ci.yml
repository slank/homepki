name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate
        run: make generate

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Build linux/arm64
        run: make cross-build

      - name: Build linux/amd64
        run: make cross-build-amd64
