name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic version format: vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Checkout Raspberry Pi image tooling
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/rpi-image-gen
          ref: d2d5705bcb37284c4b08c0ce43c039b1f1004e25
          path: .build/rpi-image-gen
          persist-credentials: false

      - name: Validate
        run: |
          make generate
          make test
          make lint

      - name: Build artifacts
        run: |
          make cross-build
          make cross-build-amd64
          make appliance-package
          make appliance-package-amd64
          make appliance-installer-package
          make appliance-installer-package-amd64
          make source-package

      - name: Build Raspberry Pi image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binfmt-support \
            debian-archive-keyring \
            qemu-user-binfmt \
            xz-utils
          sudo .build/rpi-image-gen/install_deps.sh
          ./scripts/build-raspberry-pi-image.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            homepki-linux-arm64 homepki-linux-arm64.tar.gz homepki-installer-linux-arm64.tar.gz \
            homepki-linux-amd64 homepki-linux-amd64.tar.gz homepki-installer-linux-amd64.tar.gz \
            "homepki-${VERSION}-source.tar.gz" \
            "homepki-${VERSION}-raspberry-pi-zero2w-arm64.img.xz" \
            > checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom.spdx.json
          format: spdx-json
          path: ./dist/homepki-linux-arm64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/homepki-linux-arm64
            dist/homepki-linux-arm64.tar.gz
            dist/homepki-installer-linux-arm64.tar.gz
            dist/homepki-linux-amd64
            dist/homepki-linux-amd64.tar.gz
            dist/homepki-installer-linux-amd64.tar.gz
            dist/homepki-${{ github.ref_name }}-source.tar.gz
            dist/homepki-${{ github.ref_name }}-raspberry-pi-zero2w-arm64.img.xz
            dist/checksums.txt
            sbom.spdx.json
