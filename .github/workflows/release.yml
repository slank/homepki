name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build artifacts
        run: |
          make cross-build
          make cross-build-amd64
          make appliance-package
          make appliance-package-amd64
          make appliance-installer-package
          make appliance-installer-package-amd64

      - name: Generate checksums
        run: |
          cd dist
          sha256sum \
            homepki-linux-arm64 homepki-linux-arm64.tar.gz homepki-installer-linux-arm64.tar.gz \
            homepki-linux-amd64 homepki-linux-amd64.tar.gz homepki-installer-linux-amd64.tar.gz \
            > checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom.spdx.json
          format: spdx-json
          path: ./dist/homepki-linux-arm64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/homepki-linux-arm64
            dist/homepki-linux-arm64.tar.gz
            dist/homepki-installer-linux-arm64.tar.gz
            dist/homepki-linux-amd64
            dist/homepki-linux-amd64.tar.gz
            dist/homepki-installer-linux-amd64.tar.gz
            dist/checksums.txt
            sbom.spdx.json
